name: Mirror site from Hostinger

# Runs on a daily schedule, and can also be triggered manually
# from the Actions tab via the "Run workflow" button.
on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily (times are UTC and may be delayed)
  workflow_dispatch:        # lets you run it by hand to test

# Allow the workflow to push commits back to the repo
permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest

    env:
      # The folder on Hostinger that holds your site files.
      # For your main domain this is usually "public_html".
      # If aero.online is an addon domain, it may be something like
      # "domains/aero.online/public_html" — adjust if needed.
      REMOTE_DIR: "public_html"
      # The folder in THIS repo where the mirrored files land.
      # Keeping them in a subfolder protects your README and this workflow.
      LOCAL_DIR: "site"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Mirror files from Hostinger over SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
        run: |
          mkdir -p "$LOCAL_DIR"
          lftp -c "
            set sftp:auto-confirm yes;
            open -u '$SFTP_USER','$SFTP_PASS' -p $SFTP_PORT sftp://$SFTP_HOST;
            mirror --verbose --delete --parallel=4 '$REMOTE_DIR' './$LOCAL_DIR';
          "

      - name: Commit and push any changes
        run: |
          git config user.name "site-mirror-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Mirror site $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
